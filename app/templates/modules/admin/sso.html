{% extends "modules/admin/base_admin.html" %}

{% block admin_content %}
<div class="mb-10">
    <div class="flex items-center gap-3 text-slate-400 mb-2">
        <a href="/admin" class="hover:text-indigo-600 transition-colors">Dashboard</a>
        <i data-lucide="chevron-right" class="w-4 h-4"></i>
        <span class="text-slate-900 font-bold">SSO Configuration</span>
    </div>
    <h1 class="text-3xl font-black text-slate-900 tracking-tighter">Identity & Access</h1>
</div>

<div class="max-w-4xl" x-data="{ 
    showSecret: false, 
    isTesting: false, 
    testResult: null,
    testMessage: '',
    async testConnection() {
        this.isTesting = true;
        this.testResult = null;
        try {
            const caUrl = document.getElementsByName('central_auth_url')[0].value;
            const res = await fetch('/api/v1/admin/sso/test', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ central_auth_url: caUrl })
            });
            const data = await res.json();
            this.testResult = data.status;
            this.testMessage = data.message;
        } catch (e) {
            this.testResult = 'error';
            this.testMessage = 'Network Error';
        } finally {
            this.isTesting = false;
            this.$nextTick(() => lucide.createIcons());
        }
    }
}">
    <form action="/admin/sso" method="POST" class="space-y-8">
        <div class="bg-white p-8 rounded-[2.5rem] border border-slate-100 shadow-sm">
            <div class="flex items-center justify-between mb-8 pb-6 border-b border-slate-50">
                <div>
                    <h3 class="text-lg font-black text-slate-900">CentralAuth Integration</h3>
                    <p class="text-xs font-medium text-slate-400 mt-1">Configure your MindStack Single Sign-On settings.</p>
                </div>
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" name="enabled" class="sr-only peer" {% if sso_config.enabled %}checked{% endif %}>
                    <div class="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-indigo-600"></div>
                </label>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="space-y-2">
                    <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-4">CENTRAL AUTH URL</label>
                    <input type="text" name="central_auth_url" value="{{ sso_config.central_auth_url }}" 
                           class="w-full px-6 py-4 bg-slate-50 border border-slate-100 rounded-2xl text-sm font-bold focus:ring-4 focus:ring-indigo-500/10 outline-none transition-all">
                </div>
                <div class="space-y-2">
                    <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-4">CLIENT ID</label>
                    <input type="text" name="client_id" value="{{ sso_config.client_id }}"
                           class="w-full px-6 py-4 bg-slate-50 border border-slate-100 rounded-2xl text-sm font-bold focus:ring-4 focus:ring-indigo-500/10 outline-none transition-all">
                </div>
                <div class="md:col-span-2 space-y-2">
                    <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-4">CLIENT SECRET</label>
                    <div class="relative">
                        <input :type="showSecret ? 'text' : 'password'" name="client_secret" value="{{ sso_config.client_secret }}"
                               class="w-full px-6 py-4 bg-slate-50 border border-slate-100 rounded-2xl text-sm font-bold focus:ring-4 focus:ring-indigo-500/10 outline-none transition-all">
                        <button type="button" @click="showSecret = !showSecret" class="absolute right-4 top-1/2 -translate-y-1/2 p-2 text-slate-400 hover:text-indigo-600 transition-colors">
                            <i :data-lucide="showSecret ? 'eye-off' : 'eye'" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>
            </div>

            <div class="mt-8 pt-6 border-t border-slate-50 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <template x-if="testResult === 'success'">
                        <div class="flex items-center gap-2 text-emerald-600">
                            <i data-lucide="check-circle" class="w-4 h-4"></i>
                            <span class="text-[10px] font-bold uppercase tracking-widest" x-text="testMessage"></span>
                        </div>
                    </template>
                    <template x-if="testResult === 'error'">
                        <div class="flex items-center gap-2 text-rose-600">
                            <i data-lucide="alert-circle" class="w-4 h-4"></i>
                            <span class="text-[10px] font-bold uppercase tracking-widest" x-text="testMessage"></span>
                        </div>
                    </template>
                </div>
                <button type="button" @click="testConnection()" :disabled="isTesting"
                        class="flex items-center gap-2 px-6 py-3 rounded-xl bg-white border border-slate-100 text-[10px] font-black text-slate-400 uppercase tracking-widest hover:text-indigo-600 hover:border-indigo-100 transition-all shadow-sm disabled:opacity-50">
                    <i x-show="!isTesting" data-lucide="zap" class="w-3.5 h-3.5"></i>
                    <div x-show="isTesting" class="w-3.5 h-3.5 border-2 border-indigo-600 border-t-transparent rounded-full animate-spin"></div>
                    <span x-text="isTesting ? 'Testing...' : 'Test Connection'"></span>
                </button>
            </div>
        </div>

        <div class="flex items-center justify-end gap-4">
            <a href="/admin" class="px-8 py-4 text-xs font-black text-slate-400 uppercase tracking-widest hover:text-slate-600 transition-colors">Cancel</a>
            <button type="submit" class="px-10 py-4 bg-indigo-600 text-white text-xs font-black uppercase tracking-[0.2em] rounded-2xl shadow-xl shadow-indigo-500/20 active:scale-95 transition-all">
                Save Changes
            </button>
        </div>
    </form>
</div>
{% endblock %}
