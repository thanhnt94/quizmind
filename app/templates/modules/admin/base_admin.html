<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Studio - QuizMind</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .sidebar-active { background: rgba(99, 102, 241, 0.1); color: #6366F1; border-right: 4px solid #6366F1; }
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900" x-data="{ sidebarOpen: true }">
    
    <!-- Sidebar -->
    <aside class="fixed top-0 left-0 bottom-0 z-50 bg-white border-r border-slate-200 transition-all duration-300 overflow-y-auto no-scrollbar"
           :class="sidebarOpen ? 'w-72' : 'w-20'">
        <div class="p-6 flex items-center gap-4 border-b border-slate-50 mb-4">
            <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white flex-shrink-0">
                <i data-lucide="shield-check" class="w-6 h-6"></i>
            </div>
            <span class="text-lg font-black tracking-tighter truncate" x-show="sidebarOpen">Admin Studio</span>
        </div>

        <nav class="px-3 space-y-1">
            <a href="/admin" class="flex items-center gap-4 px-4 py-3.5 rounded-xl transition-all hover:bg-slate-50 group {% if active_page == 'dashboard' %}sidebar-active{% endif %}">
                <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
                <span class="text-sm font-bold" x-show="sidebarOpen">Dashboard</span>
            </a>
            <a href="/admin/users" class="flex items-center gap-4 px-4 py-3.5 rounded-xl transition-all hover:bg-slate-50 group {% if active_page == 'users' %}sidebar-active{% endif %}">
                <i data-lucide="users" class="w-5 h-5"></i>
                <span class="text-sm font-bold" x-show="sidebarOpen">User Management</span>
            </a>
            <a href="/admin/sso" class="flex items-center gap-4 px-4 py-3.5 rounded-xl transition-all hover:bg-slate-50 group {% if active_page == 'sso' %}sidebar-active{% endif %}">
                <i data-lucide="key" class="w-5 h-5"></i>
                <span class="text-sm font-bold" x-show="sidebarOpen">SSO Configuration</span>
            </a>
            <a href="/admin/maintenance" class="flex items-center gap-4 px-4 py-3.5 rounded-xl transition-all hover:bg-slate-50 group {% if active_page == 'maintenance' %}sidebar-active{% endif %}">
                <i data-lucide="settings-2" class="w-5 h-5"></i>
                <span class="text-sm font-bold" x-show="sidebarOpen">Maintenance</span>
            </a>
        </nav>

        <div class="absolute bottom-6 left-0 right-0 px-6">
            <a href="/" class="flex items-center gap-4 p-4 bg-slate-900 text-white rounded-2xl shadow-xl shadow-slate-900/20 active:scale-95 transition-all">
                <i data-lucide="arrow-left" class="w-5 h-5"></i>
                <span class="text-xs font-black uppercase tracking-widest" x-show="sidebarOpen">Back to Site</span>
            </a>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="transition-all duration-300" :class="sidebarOpen ? 'ml-72' : 'ml-20'">
        <!-- Top Header -->
        <header class="sticky top-0 z-40 bg-white/80 backdrop-blur-xl border-b border-slate-100 px-8 py-4 flex items-center justify-between">
            <button @click="sidebarOpen = !sidebarOpen" class="w-10 h-10 rounded-xl bg-slate-50 flex items-center justify-center text-slate-400">
                <i data-lucide="menu" class="w-5 h-5"></i>
            </button>
            <div class="flex items-center gap-4">
                <div class="text-right">
                    <p class="text-sm font-black">{{ user.full_name or user.username }}</p>
                    <p class="text-[10px] font-black text-indigo-600 uppercase tracking-widest">System Administrator</p>
                </div>
                <div class="w-10 h-10 rounded-full bg-slate-100 border-2 border-white shadow-sm overflow-hidden">
                    <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Admin" alt="avatar">
                </div>
            </div>
        </header>

        <div class="p-8">
            {% block admin_content %}{% endblock %}
        </div>
    </main>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
