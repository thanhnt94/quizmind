{% extends "base.html" %}

{% block content %}
<style>
    @keyframes success-pop { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }
    .card-success { animation: success-pop 0.4s ease; border-color: #10B981 !important; box-shadow: 0 0 20px rgba(16, 185, 129, 0.1) !important; }
    .card-error { animation: error-shake 0.3s ease; border-color: #EF4444 !important; }
    @keyframes error-shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
    
    .stats-micro-pill { background: white; border: 1px solid #F1F5F9; border-radius: 12px; }
    .floating-xp { animation: float-up 0.8s ease-out forwards; }
    @keyframes float-up { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-40px); } }

    .ai-glow {
        background: linear-gradient(135deg, rgba(99, 102, 241, 0.05) 0%, rgba(168, 85, 247, 0.05) 100%);
        border: 1px solid rgba(99, 102, 241, 0.2);
        box-shadow: 0 0 15px rgba(99, 102, 241, 0.05);
    }
    
    .btn-ai { background: linear-gradient(135deg, #6366F1 0%, #A855F7 100%); box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3); }
    .map-drawer::-webkit-scrollbar { width: 4px; }
    .map-drawer::-webkit-scrollbar-thumb { background: #E2E8F0; border-radius: 10px; }

    .history-dot { position: absolute; top: 2px; right: 2px; width: 4px; height: 4px; background: #6366F1; border-radius: 50%; }
    .white-pre-wrap { white-space: pre-wrap; }
    .markdown-content ul { list-style-type: disc; margin-left: 1.5rem; margin-top: 0.5rem; margin-bottom: 0.5rem; }
    .markdown-content ol { list-style-type: decimal; margin-left: 1.5rem; margin-top: 0.5rem; margin-bottom: 0.5rem; }
    .markdown-content p { margin-bottom: 0.5rem; }

    .insight-sidebar-shadow {
        box-shadow: 20px 0 50px rgba(0,0,0,0.02);
    }
</style>

<div class="min-h-screen bg-[#F8FAFC] text-slate-900 overflow-x-hidden font-['Inter']" x-data="quizPlayer()" x-init="initPlayer()">
    
    <!-- Ultra Compact Header -->
    <header class="fixed top-0 left-0 right-0 z-[120] bg-white/80 backdrop-blur-xl border-b border-slate-100 px-4 py-2 flex items-center justify-between shadow-sm">
        <div class="flex items-center gap-2">
            <button @click="confirmExit()" class="w-8 h-8 flex items-center justify-center bg-white border border-slate-100 rounded-lg text-indigo-600 shadow-sm active:scale-90 transition-all">
                <i data-lucide="chevron-left" class="w-4 h-4"></i>
            </button>
            <div class="flex flex-col">
                <h1 class="text-[10px] font-black text-slate-400 uppercase tracking-widest truncate max-w-[200px] md:max-w-md" x-text="quizMetadata.title"></h1>
                <div class="flex items-center gap-1.5">
                    <span class="text-[12px] font-black text-indigo-600" x-text="totalXP + ' XP'"></span>
                    <template x-if="streak >= 2">
                        <div class="flex items-center gap-0.5 px-2 py-0.5 rounded-full bg-orange-500 text-white text-[8px] font-black">
                            <i data-lucide="flame" class="w-3 h-3 fill-white"></i>
                            <span x-text="streak"></span>
                        </div>
                    </template>
                </div>
            </div>
        </div>

        <div class="flex items-center gap-2">
            <div x-show="modeSelected && !finished" class="flex items-center gap-1.5 px-2.5 py-1.5 bg-slate-900 rounded-lg text-white">
                <i data-lucide="timer" class="w-3 h-3 text-indigo-400"></i>
                <span class="text-[10px] font-black mono-font" x-text="perQuestionSeconds + 's'"></span>
            </div>
            <button @click="showMobileMap = true" class="lg:hidden w-8 h-8 flex items-center justify-center bg-indigo-50 border border-indigo-100 rounded-lg text-indigo-600">
                <i data-lucide="layout-grid" class="w-4 h-4"></i>
            </button>
        </div>
    </header>

    <!-- Mode Selection Overlay -->
    <div x-show="!modeSelected && !isLoadingSession" x-transition class="fixed inset-0 z-[110] bg-white flex flex-col pt-20 px-6 overflow-y-auto">
        <div class="max-w-md mx-auto w-full py-8">
            <div class="text-center mb-10">
                <h2 class="text-4xl font-black text-slate-900 mb-2 tracking-tighter uppercase">CHOOSE YOUR PATH</h2>
                <p class="text-slate-400 text-[10px] font-bold uppercase tracking-widest">Select a learning mode to begin</p>
            </div>
            
            <div class="space-y-4">
                <button @click="startQuiz('sequential')" class="w-full p-5 rounded-2xl bg-white border-2 border-slate-50 flex items-center gap-5 hover:border-indigo-300 transition-all active:scale-95 shadow-sm group">
                    <div class="w-12 h-12 rounded-xl bg-indigo-50 flex items-center justify-center text-indigo-600 group-hover:bg-indigo-600 group-hover:text-white transition-colors"><i data-lucide="layers" class="w-6 h-6"></i></div>
                    <div class="text-left">
                        <h3 class="text-lg font-black text-slate-800">Classic Mode</h3>
                        <p class="text-[10px] font-medium text-slate-400 uppercase tracking-widest">New Questions Only (Strict)</p>
                    </div>
                </button>

                <button @click="startQuiz('random')" class="w-full p-5 rounded-2xl bg-white border-2 border-slate-50 flex items-center gap-5 hover:border-indigo-300 transition-all active:scale-95 shadow-sm group">
                    <div class="w-12 h-12 rounded-xl bg-amber-50 flex items-center justify-center text-amber-600 group-hover:bg-amber-500 group-hover:text-white transition-colors"><i data-lucide="shuffle" class="w-6 h-6"></i></div>
                    <div class="text-left">
                        <h3 class="text-lg font-black text-slate-800">Chaos Mode</h3>
                        <p class="text-[10px] font-medium text-slate-400 uppercase tracking-widest">Randomized Order</p>
                    </div>
                </button>

                <button @click="startQuiz('mastery')" class="w-full p-5 rounded-2xl bg-white border-2 border-slate-50 flex items-center gap-5 hover:border-indigo-300 transition-all active:scale-95 shadow-sm group">
                    <div class="w-12 h-12 rounded-xl bg-rose-50 flex items-center justify-center text-rose-600 group-hover:bg-rose-500 group-hover:text-white transition-colors"><i data-lucide="target" class="w-6 h-6"></i></div>
                    <div class="text-left">
                        <h3 class="text-lg font-black text-slate-800">Mastery Mode</h3>
                        <p class="text-[10px] font-medium text-slate-400 uppercase tracking-widest">Fix Your Mistakes</p>
                    </div>
                </button>
            </div>

            <div class="mt-12 pt-8 border-t border-slate-50 text-center">
                <button @click="resetSession()" class="flex items-center justify-center gap-2 mx-auto px-6 py-3 rounded-xl border-2 border-slate-100 text-slate-400 hover:text-rose-500 hover:border-rose-100 transition-all text-[10px] font-black uppercase tracking-[0.2em]">
                    <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
                    Reset Current Progress
                </button>
            </div>
        </div>
    </div>

    <!-- Mobile Map Drawer -->
    <div x-show="showMobileMap" class="fixed inset-0 z-[300]" x-cloak>
        <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm" @click="showMobileMap = false"></div>
        <div class="absolute right-0 top-0 bottom-0 w-[280px] bg-white shadow-2xl flex flex-col p-6 map-drawer overflow-y-auto" 
             x-transition:enter="transition ease-out duration-300" x-transition:enter-start="translate-x-full" x-transition:enter-end="translate-x-0">
            <div class="flex items-center justify-between mb-8">
                <h4 class="text-[10px] font-black text-slate-900 uppercase tracking-widest">QUIZ MAP</h4>
                <button @click="showMobileMap = false" class="text-slate-300"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <div class="grid grid-cols-5 gap-2">
                <template x-for="(q, i) in questions" :key="i">
                    <button @click="jumpTo(i); showMobileMap = false" 
                            class="aspect-square rounded-lg border flex items-center justify-center font-black text-[9px] transition-all relative" 
                            :class="getSidebarItemClass(i)">
                        <span x-text="i+1"></span>
                        <div x-show="q.stats?.total > 0 && userAnswers[i] === undefined" class="history-dot"></div>
                    </button>
                </template>
            </div>
        </div>
    </div>

    <!-- Play Interface -->
    <main x-show="modeSelected && !finished" class="pt-14 pb-28 px-0 flex flex-col lg:flex-row w-full max-w-[1600px] mx-auto h-screen overflow-hidden">
        
        <!-- Left Insights Sidebar (Desktop) -->
        <aside x-show="showFeedback" x-transition:enter="transition ease-out duration-500" x-transition:enter-start="-translate-x-full opacity-0" x-transition:enter-end="translate-x-0 opacity-100"
               class="hidden lg:flex flex-col w-[400px] bg-white border-r border-slate-100 overflow-hidden h-full z-[90] insight-sidebar-shadow">
            <div class="p-6 border-b border-slate-50 flex items-center justify-center">
                <span class="text-[11px] font-black text-indigo-600 uppercase tracking-[0.3em]">Learning Insights</span>
            </div>
            
            <!-- Content Area -->
            <div class="flex-1 overflow-y-auto p-8 custom-scrollbar space-y-6">
                <!-- Insight Tab Content -->
                <div x-show="insightTab === 'insight'" x-transition class="space-y-4">
                     <div class="p-8 rounded-[2.5rem] bg-indigo-50/40 border border-indigo-100/50">
                        <div class="flex items-center gap-2 mb-6">
                            <div class="w-8 h-8 rounded-xl bg-amber-100 flex items-center justify-center text-amber-600">
                                <i data-lucide="lightbulb" class="w-4 h-4 fill-amber-500"></i>
                            </div>
                            <span class="text-[10px] font-black text-indigo-400 uppercase tracking-widest">Core Insight</span>
                        </div>
                        <div class="text-slate-600 font-medium text-base leading-relaxed markdown-content" x-html="renderMarkdown(currentQuestion?.explanation || 'No detail.')"></div>
                    </div>
                </div>

                <!-- AI Tab Content -->
                <div x-show="insightTab === 'ai'" x-transition class="space-y-4">
                    <div class="p-8 rounded-[2.5rem] ai-glow">
                        <div class="flex items-center justify-between mb-6">
                            <div class="flex items-center gap-2">
                                <i data-lucide="sparkles" class="w-5 h-5 text-indigo-500 animate-pulse"></i>
                                <span class="text-[10px] font-black text-indigo-600 uppercase tracking-widest">AI Analysis</span>
                            </div>
                        </div>
                        <div x-show="isAskingAI" class="flex flex-col items-center justify-center py-12 gap-4">
                            <div class="w-8 h-8 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin"></div>
                            <p class="text-[11px] font-black text-slate-400 uppercase tracking-widest animate-pulse">Consulting the AI Neural Network...</p>
                        </div>
                        <div x-show="!currentQuestion?.ai_explanation && !isAskingAI" class="flex flex-col items-center justify-center py-12 text-center">
                             <button @click="askAI()" class="px-8 py-4 rounded-2xl btn-ai text-white text-[11px] font-black uppercase tracking-widest active:scale-95 transition-all">
                                Generate AI Analysis
                            </button>
                        </div>
                        <div x-show="currentQuestion?.ai_explanation" x-transition>
                            <div class="text-slate-700 font-medium text-base leading-relaxed markdown-content italic" x-html="renderMarkdown(currentQuestion?.ai_explanation)"></div>
                        </div>
                    </div>
                </div>

                <!-- Note Tab Content -->
                <div x-show="insightTab === 'note'" x-transition class="space-y-4 h-full">
                     <div class="p-8 rounded-[2.5rem] bg-white border border-slate-100 shadow-sm h-full flex flex-col">
                        <div class="flex items-center justify-between mb-6">
                            <div class="flex items-center gap-2">
                                <div class="w-8 h-8 rounded-xl bg-slate-100 flex items-center justify-center text-slate-500">
                                    <i data-lucide="sticky-note" class="w-4 h-4"></i>
                                </div>
                                <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Your Private Study Note</span>
                            </div>
                            <div x-show="isSavingNote" class="flex items-center gap-2">
                                <div class="w-2 h-2 bg-indigo-500 rounded-full animate-ping"></div>
                                <span class="text-[8px] font-bold text-indigo-500 uppercase tracking-widest">Autosaving...</span>
                            </div>
                        </div>
                        <textarea x-model="personalNote" @input.debounce.1000ms="saveNote()" 
                                  placeholder="Type your notes here... Your insights are saved automatically."
                                  class="flex-1 w-full p-6 bg-slate-50 border border-slate-100 rounded-[2rem] text-base font-medium focus:ring-4 focus:ring-indigo-500/10 outline-none transition-all resize-none"></textarea>
                    </div>
                </div>
            </div>

            <!-- Bottom Control Bar (Like Mobile) -->
            <div class="p-6 bg-slate-50/50 border-t border-slate-100 flex items-center justify-between gap-4">
                <button @click="insightTab = 'note'" class="w-12 h-12 flex items-center justify-center rounded-2xl bg-white border border-slate-100 text-slate-400 hover:text-indigo-600 shadow-sm transition-all active:scale-90">
                    <i data-lucide="pencil" class="w-5 h-5"></i>
                </button>
                
                <div class="flex items-center gap-2 bg-white p-1.5 rounded-2xl border border-slate-100 shadow-sm">
                    <button @click="insightTab = 'insight'" :class="insightTab === 'insight' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-200' : 'text-slate-300 hover:text-indigo-400'" class="w-12 h-12 flex items-center justify-center rounded-xl transition-all">
                        <i data-lucide="lightbulb" class="w-5 h-5"></i>
                    </button>
                    <button @click="insightTab = 'ai'" :class="insightTab === 'ai' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-200' : 'text-slate-300 hover:text-indigo-400'" class="w-12 h-12 flex items-center justify-center rounded-xl transition-all">
                        <i data-lucide="sparkles" class="w-5 h-5"></i>
                    </button>
                    <button @click="insightTab = 'note'" :class="insightTab === 'note' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-200' : 'text-slate-300 hover:text-indigo-400'" class="w-12 h-12 flex items-center justify-center rounded-xl transition-all">
                        <i data-lucide="file-text" class="w-5 h-5"></i>
                    </button>
                </div>

                <button @click="copyInsight()" class="w-12 h-12 flex items-center justify-center rounded-2xl bg-white border border-slate-100 text-slate-400 hover:text-indigo-600 shadow-sm transition-all active:scale-90">
                    <i data-lucide="copy" class="w-5 h-5"></i>
                </button>
            </div>
        </aside>

        <div class="flex-1 overflow-y-auto px-4 md:px-8 pb-32 custom-scrollbar">
            <div class="max-w-2xl mx-auto">
                <div class="mt-4 mb-6">
                    <div class="flex items-center justify-between mb-2 px-0.5">
                        <span class="text-[8px] font-black text-slate-300 uppercase tracking-widest">STEP <span x-text="currentIndex+1"></span>/<span x-text="questions.length"></span></span>
                        <div class="flex items-center gap-4 stats-micro-pill px-3 py-1 shadow-sm">
                            <div class="flex items-center gap-1.5"><i data-lucide="history" class="w-3 h-3 text-slate-300"></i><span class="text-[9px] font-bold text-slate-500" x-text="currentQuestion?.stats?.total || 0"></span></div>
                            <div class="flex items-center gap-1.5"><i data-lucide="check-circle" class="w-3 h-3 text-emerald-400"></i><span class="text-[9px] font-bold text-emerald-600" x-text="currentQuestion?.stats?.correct || 0"></span></div>
                            <div class="flex items-center gap-1.5"><i data-lucide="zap" class="w-3 h-3 text-amber-400"></i><span class="text-[9px] font-bold text-slate-500"><span x-text="currentQuestion?.stats?.avg_time || 0"></span>s</span></div>
                        </div>
                    </div>
                    <div class="h-1 bg-slate-100 rounded-full overflow-hidden">
                        <div class="h-full bg-indigo-600 transition-all duration-700" :style="'width: ' + ((currentIndex+1)/questions.length*100) + '%'"></div>
                    </div>
                </div>

                <div class="bg-white rounded-2xl border border-slate-100 shadow-[0_8px_30px_rgb(0,0,0,0.02)] overflow-hidden transition-all duration-300"
                     :class="[feedbackType === 'success' ? 'card-success' : (feedbackType === 'error' ? 'card-error' : ''), !isFocused ? 'blur-sm opacity-50' : '']">
                    
                    <div class="p-6 md:p-10 bg-slate-50/50 border-b border-slate-100 relative">
                        <template x-if="showXPToast">
                            <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 floating-xp z-50">
                                <span class="text-3xl font-black text-indigo-600" x-text="'+' + lastXPGain + ' XP'"></span>
                            </div>
                        </template>
                        <h2 class="text-xl md:text-2xl font-bold text-slate-900 leading-snug white-pre-wrap tracking-tight" x-text="currentQuestion?.content || 'Loading...'"></h2>
                    </div>

                    <div class="p-6 md:p-10 space-y-3">
                        <template x-for="(opt, idx) in currentQuestion?.options" :key="idx">
                            <button @click="selectOption(idx)" :disabled="showFeedback"
                                    class="w-full p-4 md:p-5 rounded-xl border-2 text-left transition-all flex items-center justify-between active:scale-[0.99] group/opt"
                                    :class="getOptionClass(idx)">
                                <div class="flex items-center gap-4">
                                    <div class="w-8 h-8 rounded-lg border-2 flex items-center justify-center font-black text-xs transition-all"
                                         :class="selectedOption === idx ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white border-slate-100 text-slate-400 group-hover/opt:border-indigo-200'">
                                        <span x-text="String.fromCharCode(65 + idx)"></span>
                                    </div>
                                    <span class="font-bold text-base md:text-lg" :class="selectedOption === idx ? 'text-indigo-900' : 'text-slate-700'" x-text="opt.content"></span>
                                </div>
                                <div x-show="showFeedback" class="flex items-center">
                                    <i data-lucide="check-circle" class="w-5 h-5 text-emerald-500" x-show="opt.is_correct"></i>
                                    <i data-lucide="x-circle" class="w-5 h-5 text-rose-500" x-show="selectedOption === idx && !opt.is_correct"></i>
                                </div>
                            </button>
                        </template>
                    </div>
                </div>

                <div class="mt-4 space-y-3 lg:hidden" x-show="showFeedback" x-transition>
                    <!-- Mobile View: Tabs inside the main scroll area -->
                    <div class="flex items-center gap-2 bg-white p-1 rounded-2xl border border-slate-100 shadow-sm mb-4">
                        <button @click="insightTab = 'insight'" :class="insightTab === 'insight' ? 'bg-indigo-600 text-white' : 'text-slate-300'" class="flex-1 py-3 flex items-center justify-center rounded-xl transition-all">
                            <i data-lucide="lightbulb" class="w-4 h-4 mr-2"></i> <span class="text-[9px] font-black uppercase">Insight</span>
                        </button>
                        <button @click="insightTab = 'ai'" :class="insightTab === 'ai' ? 'bg-indigo-600 text-white' : 'text-slate-300'" class="flex-1 py-3 flex items-center justify-center rounded-xl transition-all">
                            <i data-lucide="sparkles" class="w-4 h-4 mr-2"></i> <span class="text-[9px] font-black uppercase">AI</span>
                        </button>
                        <button @click="insightTab = 'note'" :class="insightTab === 'note' ? 'bg-indigo-600 text-white' : 'text-slate-300'" class="flex-1 py-3 flex items-center justify-center rounded-xl transition-all">
                            <i data-lucide="file-text" class="w-4 h-4 mr-2"></i> <span class="text-[9px] font-black uppercase">Note</span>
                        </button>
                    </div>

                    <div x-show="insightTab === 'insight'" class="p-6 rounded-2xl bg-indigo-50/30 border border-indigo-100/50">
                        <div class="text-slate-600 font-medium text-sm leading-relaxed markdown-content" x-html="renderMarkdown(currentQuestion?.explanation || 'No detail.')"></div>
                    </div>

                    <div x-show="insightTab === 'ai'" class="p-6 rounded-2xl ai-glow">
                        <div x-show="isAskingAI" class="flex items-center gap-3 py-4">
                            <div class="w-4 h-4 border-2 border-indigo-600 border-t-transparent rounded-full animate-spin"></div>
                            <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest animate-pulse">AI is thinking...</p>
                        </div>
                        <div x-show="!currentQuestion?.ai_explanation && !isAskingAI" class="flex flex-col items-center justify-center py-4">
                             <button @click="askAI()" class="px-4 py-2 rounded-xl btn-ai text-white text-[9px] font-black uppercase tracking-widest">ASK AI</button>
                        </div>
                        <div x-show="currentQuestion?.ai_explanation" class="text-slate-700 font-medium text-sm leading-relaxed markdown-content italic" x-html="renderMarkdown(currentQuestion?.ai_explanation)"></div>
                    </div>

                    <div x-show="insightTab === 'note'" class="p-6 rounded-2xl bg-white border border-slate-100 shadow-sm">
                        <textarea x-model="personalNote" @input.debounce.1000ms="saveNote()" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-xl text-sm min-h-[120px] outline-none"></textarea>
                    </div>
                    
                    <div class="flex justify-between mt-2">
                        <button @click="copyInsight()" class="p-3 rounded-xl bg-slate-100 text-slate-500"><i data-lucide="copy" class="w-4 h-4"></i></button>
                        <button @click="insightTab = 'note'" class="p-3 rounded-xl bg-slate-100 text-slate-500"><i data-lucide="pencil" class="w-4 h-4"></i></button>
                    </div>
                </div>
            </div>
        </div>

        <aside class="hidden lg:block w-[240px] bg-white border-l border-slate-100 p-6 overflow-y-auto custom-scrollbar">
            <h4 class="text-[8px] font-black text-slate-300 uppercase tracking-widest mb-4">MAP</h4>
            <div class="grid grid-cols-5 gap-2">
                <template x-for="(q, i) in questions" :key="i">
                    <button @click="jumpTo(i)" class="aspect-square rounded-lg border flex items-center justify-center font-black text-[9px] transition-all relative" :class="getSidebarItemClass(i)">
                        <span x-text="i+1"></span>
                        <div x-show="q.stats?.total > 0 && userAnswers[i] === undefined" class="history-dot"></div>
                    </button>
                </template>
            </div>
        </aside>
    </main>

    <div class="fixed bottom-0 left-0 right-0 p-4 bg-white/70 backdrop-blur-2xl border-t border-slate-100 z-[100]">
        <div class="max-w-2xl mx-auto flex gap-3">
            <button x-show="!showFeedback" @click="submitAnswer()" :disabled="selectedOption === null"
                    class="flex-1 py-4 bg-slate-900 text-white font-black text-xs rounded-xl shadow-lg uppercase tracking-widest active:scale-95 transition-all disabled:opacity-20">
                SUBMIT RESPONSE
            </button>
            <button x-show="showFeedback" @click="nextQuestion()"
                    class="flex-1 py-4 bg-indigo-600 text-white font-black text-xs rounded-xl shadow-lg flex items-center justify-center gap-3 uppercase tracking-widest active:scale-95 transition-all">
                NEXT QUESTION <i data-lucide="arrow-right" class="w-4 h-4"></i>
            </button>
        </div>
    </div>
</div>

<script>
function quizPlayer() {
    return {
        allQuestions: {{ questions | tojson }},
        quizMetadata: {{ quiz | tojson }},
        questions: [], currentIndex: 0, selectedOption: null, showFeedback: false, feedbackType: null,
        score: 0, streak: 0, totalXP: 0, showXPToast: false, lastXPGain: 0, finished: false,
        modeSelected: false, currentMode: 'sequential', perQuestionSeconds: 0, isFocused: true,
        userAnswers: [], isLoadingSession: true, showMobileMap: false, isAskingAI: false,
        personalNote: '', isSavingNote: false, notePreview: false,
        insightTab: 'insight',
        copyInsight() {
            let content = '';
            if (this.insightTab === 'insight') content = this.currentQuestion?.explanation || '';
            else if (this.insightTab === 'ai') content = this.currentQuestion?.ai_explanation || '';
            else content = this.personalNote || '';
            
            if (content) {
                // Strip HTML if needed, but for now copy raw (Markdown/BBCode)
                const el = document.createElement('textarea');
                el.value = content.replace(/<[^>]*>?/gm, ''); // Basic HTML strip
                document.body.appendChild(el);
                el.select();
                document.execCommand('copy');
                document.body.removeChild(el);
                
                // Show a micro-toast or something? 
                alert("Copied to clipboard!");
            }
        },
        get currentQuestion() { return this.questions[this.currentIndex]; },
        async initPlayer() {
            window.addEventListener('focus', () => { this.isFocused = true; });
            window.addEventListener('blur', () => { this.isFocused = false; });
            try {
                const res = await fetch(`/api/v1/quiz/${this.quizMetadata.id}/session`);
                const session = await res.json();
                if (session && session.mode) {
                    this.currentMode = session.mode; this.currentIndex = session.current_index;
                    this.userAnswers = session.state.userAnswers || [];
                    this.score = session.state.score || 0; this.streak = session.state.streak || 0;
                    this.totalXP = session.state.totalXP || 0;
                    if (this.currentMode === 'random') {
                        this.questions = session.state.questionOrder.map(id => this.allQuestions.find(q => q.id === id));
                    } else if (this.currentMode === 'mastery') {
                        const resM = await fetch(`/api/v1/quiz/${this.quizMetadata.id}/mistakes`);
                        this.questions = await resM.json();
                    } else {
                        // Sequential (Classic) - Restore saved order or all
                        this.questions = [...this.allQuestions];
                    }
                    this.modeSelected = true;
                    this.showFeedback = (this.userAnswers[this.currentIndex]?.is_correct !== undefined);
                    this.selectedOption = this.userAnswers[this.currentIndex]?.idx ?? null;
                    this.startQuestionTimer();
                    await this.fetchNote();
                }
            } catch (e) {} finally { this.isLoadingSession = false; this.$nextTick(() => lucide.createIcons()); }
        },
        async startQuiz(mode) {
            this.currentMode = mode;
            if (mode === 'sequential') {
                // CLASSIC: New questions only (stats.total == 0)
                this.questions = this.allQuestions.filter(q => (q.stats?.total || 0) === 0);
                if (this.questions.length === 0) {
                    alert("No new questions! Loading all questions instead.");
                    this.questions = [...this.allQuestions];
                }
            } else if (mode === 'random') {
                this.questions = [...this.allQuestions].sort(() => Math.random() - 0.5);
            } else if (mode === 'mastery') {
                const res = await fetch(`/api/v1/quiz/${this.quizMetadata.id}/mistakes`);
                this.questions = await res.json();
            }
            this.modeSelected = true; this.startQuestionTimer();
            this.saveSession(this.questions.map(q => q.id));
            await this.fetchNote();
            this.$nextTick(() => lucide.createIcons());
        },
        async resetSession() {
            if (!confirm("Are you sure? This will clear ALL current progress for this quiz.")) return;
            await fetch(`/api/v1/quiz/${this.quizMetadata.id}/session`, { method: 'DELETE' });
            location.reload();
        },
        async saveSession(qOrder = null) {
            const state = { userAnswers: this.userAnswers, score: this.score, streak: this.streak, totalXP: this.totalXP, questionOrder: qOrder };
            fetch(`/api/v1/quiz/${this.quizMetadata.id}/session`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ mode: this.currentMode, current_index: this.currentIndex, state: state }) });
        },
        startQuestionTimer() {
            this.perQuestionSeconds = 0;
            if (this.questionTimerInterval) clearInterval(this.questionTimerInterval);
            this.questionTimerInterval = setInterval(() => { if (this.isFocused && !this.showFeedback && !this.finished) this.perQuestionSeconds++; }, 1000);
        },
        selectOption(idx) { this.selectedOption = idx; this.feedbackType = null; },
        submitAnswer() {
            if (this.selectedOption === null) return;
            this.showFeedback = true; const correct = this.currentQuestion.options[this.selectedOption].is_correct;
            this.feedbackType = correct ? 'success' : 'error';
            if (!this.currentQuestion.stats) this.currentQuestion.stats = { total: 0, correct: 0, avg_time: 0 };
            const s = this.currentQuestion.stats;
            s.avg_time = Math.round(((s.avg_time * s.total) + this.perQuestionSeconds) / (s.total + 1) * 10) / 10;
            s.total++; if (correct) s.correct++;
            if (correct) { 
                this.score++; this.streak++; this.lastXPGain = 10 + (this.perQuestionSeconds < 5 ? 5 : 0); this.totalXP += this.lastXPGain;
                this.showXPToast = true; setTimeout(() => this.showXPToast = false, 800);
                if (this.streak % 5 === 0) confetti({ particleCount: 100, spread: 60, origin: { y: 0.7 } });
            } else { this.streak = 0; }
            this.userAnswers[this.currentIndex] = { idx: this.selectedOption, is_correct: correct };
            this.recordAnswer(this.currentQuestion.id, this.currentQuestion.options[this.selectedOption].id, correct, this.perQuestionSeconds);
            this.saveSession(); this.$nextTick(() => lucide.createIcons());
        },
        async askAI() {
            this.isAskingAI = true;
            try {
                const res = await fetch(`/api/v1/quiz/${this.quizMetadata.id}/ask-ai`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ question_id: this.currentQuestion.id }) });
                const data = await res.json();
                if (data.ai_explanation) { this.currentQuestion.ai_explanation = data.ai_explanation; }
            } catch (e) { alert("AI service unavailable."); } finally { this.isAskingAI = false; }
        },
        renderMarkdown(text) {
            if (!text) return '';
            marked.setOptions({ breaks: true });
            // Convert "--- TEXT ---" to a bold highlighted format
            let processed = text.replace(/--- (.*?) ---/g, '\n**$1**\n');
            processed = this.renderBBCode(processed);
            return marked.parse(processed);
        },
        renderBBCode(text) {
            if (!text) return '';
            const bbMap = [
                { re: /\[b\]([\s\S]*?)\[\/b\]/gi, res: '<strong>$1</strong>' },
                { re: /\[i\]([\s\S]*?)\[\/i\]/gi, res: '<em>$1</em>' },
                { re: /\[u\]([\s\S]*?)\[\/u\]/gi, res: '<u>$1</u>' },
                { re: /\[url=([\s\S]*?)\]([\s\S]*?)\[\/url\]/gi, res: '<a href="$1" target="_blank" class="text-indigo-600 underline">$2</a>' },
                { re: /\[url\]([\s\S]*?)\[\/url\]/gi, res: '<a href="$1" target="_blank" class="text-indigo-600 underline">$1</a>' },
                { re: /\[color=([\s\S]*?)\]([\s\S]*?)\[\/color\]/gi, res: '<span style="color: $1">$2</span>' },
                { re: /\[size=([\s\S]*?)\]([\s\S]*?)\[\/size\]/gi, res: '<span style="font-size: $1px">$2</span>' },
                { re: /\[img\]([\s\S]*?)\[\/img\]/gi, res: '<img src="$1" class="max-w-full rounded-lg" />' },
                { re: /\[code\]([\s\S]*?)\[\/code\]/gi, res: '<code>$1</code>' }
            ];
            bbMap.forEach(rule => { text = text.replace(rule.re, rule.res); });
            return text;
        },
        async fetchNote() {
            if (!this.currentQuestion) return;
            try {
                const res = await fetch(`/api/v1/quiz/question/${this.currentQuestion.id}/note`);
                const data = await res.json();
                this.personalNote = data.content || '';
            } catch (e) { this.personalNote = ''; }
        },
        async saveNote() {
            if (!this.currentQuestion) return;
            this.isSavingNote = true;
            try {
                await fetch(`/api/v1/quiz/question/${this.currentQuestion.id}/note`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: this.personalNote })
                });
            } catch (e) {} finally { 
                setTimeout(() => { this.isSavingNote = false; }, 500);
            }
        },
        async nextQuestion() {
            if (this.currentIndex < this.questions.length - 1) {
                this.currentIndex++; this.selectedOption = this.userAnswers[this.currentIndex]?.idx ?? null;
                this.showFeedback = (this.userAnswers[this.currentIndex]?.is_correct !== undefined);
                this.startQuestionTimer(); this.saveSession(); 
                await this.fetchNote();
                document.querySelector('.custom-scrollbar')?.scrollTo(0, 0);
            } else this.finished = true;
            this.$nextTick(() => lucide.createIcons());
        },
        async jumpTo(i) { this.currentIndex = i; this.selectedOption = this.userAnswers[i]?.idx ?? null; this.showFeedback = (this.userAnswers[i]?.is_correct !== undefined); this.startQuestionTimer(); this.saveSession(); await this.fetchNote(); this.$nextTick(() => lucide.createIcons()); },
        recordAnswer(q, o, c, t) { fetch('/api/v1/quiz/record_answer', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ question_id: q, selected_option_id: o, is_correct: c, active_time: t }) }); },
        getOptionClass(idx) {
            if (!this.showFeedback) return this.selectedOption === idx ? 'border-indigo-600 bg-indigo-50/20' : 'border-slate-50 bg-white';
            if (this.currentQuestion.options[idx].is_correct) return 'border-emerald-500 bg-emerald-50 text-emerald-600';
            if (this.selectedOption === idx) return 'border-rose-500 bg-rose-50 text-rose-600';
            return 'border-slate-50 opacity-40';
        },
        getSidebarItemClass(i) {
            if (this.currentIndex === i) return 'bg-slate-900 text-white border-slate-900 shadow-sm';
            const ans = this.userAnswers[i];
            if (ans !== undefined) return ans.is_correct ? 'bg-emerald-50 text-emerald-600 border-emerald-100' : 'bg-rose-50 text-rose-600 border-rose-100';
            if (this.questions[i]?.stats?.total > 0) return 'bg-slate-50 text-slate-400 border-slate-100 italic';
            return 'bg-white text-slate-300';
        },
        confirmExit() { if (confirm("Exit?")) window.location.href = "/dashboard"; }
    }
}
</script>
{% endblock %}
