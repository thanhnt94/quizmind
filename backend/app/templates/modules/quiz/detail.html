{% extends "base.html" %}

{% block content %}
<div class="min-h-screen bg-[#F8FAFC]" x-data="detailController()">
    
    <!-- Mobile Top Navigation Bar (Fixed) -->
    <nav class="fixed top-0 left-0 right-0 z-[120] bg-white/80 backdrop-blur-2xl border-b border-slate-100 px-4 py-3 flex items-center gap-4 md:hidden">
        <a href="/" class="w-10 h-10 flex items-center justify-center bg-white border border-slate-100 rounded-xl text-indigo-600 shadow-sm active:scale-90 transition-all">
            <i data-lucide="chevron-left" class="w-6 h-6"></i>
        </a>
        <div class="flex-1 min-w-0">
            <p class="text-[9px] font-black text-slate-400 uppercase tracking-widest leading-none mb-1">QUIZ DETAIL</p>
            <h2 class="text-sm font-black text-slate-900 truncate tracking-tight">{{ quiz.title }}</h2>
        </div>
    </nav>

    <div class="pt-20 md:pt-32 pb-40">
        <!-- Quiz Header (Compact Premium) -->
        <div class="px-6 max-w-5xl mx-auto mb-10">
            <div class="bg-white rounded-[2.5rem] p-8 md:p-12 shadow-sm border border-slate-100 flex flex-col md:flex-row gap-8 items-center md:items-start relative overflow-hidden">
                <div class="absolute top-0 right-0 p-12 opacity-[0.03]"><i data-lucide="award" class="w-48 h-48"></i></div>
                
                <div class="w-20 h-20 md:w-28 md:h-28 rounded-3xl bg-gradient-to-br from-indigo-50 to-white border border-indigo-100 flex items-center justify-center flex-shrink-0 relative z-10 shadow-sm">
                    <i data-lucide="book-open" class="w-10 h-10 text-indigo-600"></i>
                </div>
                
                <div class="flex-1 text-center md:text-left relative z-10">
                    <div class="flex flex-wrap items-center justify-center md:justify-start gap-3 mb-3">
                        <span class="px-2.5 py-1 rounded-lg bg-emerald-50 text-emerald-600 text-[9px] font-black uppercase tracking-widest">
                            <span x-text="totalQuestions"></span> CÂU HỎI
                        </span>
                        <span class="px-2.5 py-1 rounded-lg bg-slate-50 text-slate-400 text-[9px] font-black uppercase tracking-widest">
                            LUYỆN TẬP
                        </span>
                    </div>
                    <h1 class="text-3xl md:text-5xl font-black text-slate-900 mb-3 tracking-tighter">{{ quiz.title }}</h1>
                    <p class="text-slate-400 font-medium text-base leading-relaxed max-w-2xl">{{ quiz.description or "Hệ thống trắc nghiệm thông minh QuizMind." }}</p>
                </div>
            </div>
        </div>

        <!-- Tabs -->
        <div class="px-6 max-w-5xl mx-auto">
            <div class="flex items-center gap-10 border-b border-slate-100 mb-8 overflow-x-auto no-scrollbar">
                <button @click="activeTab = 'list'" class="pb-4 text-[10px] font-black uppercase tracking-[0.2em] transition-all relative whitespace-nowrap"
                        :class="activeTab === 'list' ? 'text-indigo-600' : 'text-slate-400'">
                    DANH SÁCH CÂU HỎI
                    <div x-show="activeTab === 'list'" class="absolute bottom-0 left-0 right-0 h-1 bg-indigo-600 rounded-t-full"></div>
                </button>
                <button @click="activeTab = 'stats'" class="pb-4 text-[10px] font-black uppercase tracking-[0.2em] transition-all relative whitespace-nowrap"
                        :class="activeTab === 'stats' ? 'text-indigo-600' : 'text-slate-400'">
                    THỐNG KÊ CHI TIẾT
                    <div x-show="activeTab === 'stats'" class="absolute bottom-0 left-0 right-0 h-1 bg-indigo-600 rounded-t-full"></div>
                </button>
            </div>

            <!-- List Tab -->
            <div x-show="activeTab === 'list'" x-transition class="space-y-1">
                <div class="relative mb-6">
                    <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-300"></i>
                    <input type="text" x-model="searchQuery" @input="page = 1" placeholder="Tìm kiếm nội dung câu hỏi..." 
                           class="w-full pl-12 pr-4 py-3 bg-white border border-slate-100 rounded-2xl text-xs focus:ring-2 focus:ring-indigo-500 outline-none shadow-sm transition-all">
                </div>

                <template x-for="(q, index) in paginatedQuestions()" :key="q.id">
                    <div class="group bg-white p-5 rounded-2xl border border-transparent hover:border-indigo-100 hover:bg-indigo-50/10 hover:shadow-sm transition-all">
                        <div class="flex flex-col md:flex-row md:items-center gap-4">
                            <div class="flex-shrink-0 min-w-[40px]">
                                <span class="text-[10px] font-black text-slate-300 uppercase tracking-widest">#<span x-text="q.orig_index"></span></span>
                            </div>
                            <div class="flex-1 min-w-0">
                                <h3 class="text-sm font-bold text-slate-700 leading-relaxed md:line-clamp-2" x-text="q.content"></h3>
                            </div>
                            <div class="flex items-center gap-5 md:ml-auto flex-shrink-0 pt-2 md:pt-0">
                                <div class="flex flex-col items-center gap-1">
                                    <span class="text-[9px] font-black text-slate-300 uppercase tracking-tighter">LẦN LÀM</span>
                                    <span class="text-xs font-black text-slate-500" x-text="q.stats.total"></span>
                                </div>
                                <div class="w-px h-6 bg-slate-100"></div>
                                <div class="flex flex-col items-center gap-1">
                                    <span class="text-[9px] font-black text-slate-300 uppercase tracking-tighter">ĐÚNG</span>
                                    <span class="text-xs font-black text-emerald-500" x-text="q.stats.correct"></span>
                                </div>
                                <div class="flex flex-col items-center gap-1">
                                    <span class="text-[9px] font-black text-slate-300 uppercase tracking-tighter">SAI</span>
                                    <span class="text-xs font-black text-rose-500" x-text="q.stats.wrong"></span>
                                </div>
                                <div x-show="userNotes[q.id]" class="w-px h-6 bg-slate-100"></div>
                                <div x-show="userNotes[q.id]" class="flex items-center text-indigo-400" :title="userNotes[q.id]">
                                    <i data-lucide="sticky-note" class="w-4 h-4"></i>
                                </div>
                            </div>
                        </div>
                        <div x-show="userNotes[q.id]" class="mt-3 p-3 bg-indigo-50/50 rounded-xl border border-indigo-100/30">
                            <p class="text-[10px] font-medium text-slate-500 italic line-clamp-2" x-text="userNotes[q.id]"></p>
                        </div>
                    </div>
                </template>
                <div class="mt-8 flex justify-center" x-show="hasMore()">
                    <button @click="loadMore()" class="px-8 py-3 bg-white border border-slate-100 rounded-xl text-[10px] font-black text-slate-400 uppercase tracking-widest shadow-sm active:scale-95">TẢI THÊM</button>
                </div>
            </div>

            <!-- Stats Tab -->
            <div x-show="activeTab === 'stats'" x-transition>
                <div class="bg-white p-12 md:p-20 rounded-[3rem] text-center border border-slate-100 shadow-sm">
                    <div class="w-20 h-20 bg-indigo-50 rounded-3xl flex items-center justify-center mx-auto mb-8 text-indigo-600">
                        <i data-lucide="bar-chart-2" class="w-10 h-10"></i>
                    </div>
                    <h3 class="text-2xl font-black text-slate-900 mb-4">Phân tích chuyên sâu</h3>
                    <p class="text-slate-500 font-medium mb-10 max-w-md mx-auto">Dữ liệu đang được tổng hợp.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Fixed Bottom Action Bar (Replacement for Bottom Nav) -->
    <div class="fixed bottom-0 left-0 right-0 p-4 md:p-8 bg-white/80 backdrop-blur-2xl border-t border-slate-100 z-[130] shadow-[0_-10px_40px_rgba(0,0,0,0.05)]">
        <div class="max-w-5xl mx-auto">
            <a href="/quiz/{{ quiz.id }}/play" class="w-full flex items-center justify-center py-5 bg-indigo-600 text-white font-black text-sm md:text-base rounded-2xl shadow-xl shadow-indigo-500/30 active:scale-95 transition-all tracking-widest uppercase">
                BẮT ĐẦU LUYỆN TẬP
            </a>
        </div>
    </div>
</div>

<script>
function detailController() {
    return {
        activeTab: 'list', searchQuery: '', page: 1, pageSize: 50, userNotes: {},
        allQuestions: [], totalQuestions: 0, isLoading: false,
        filteredQuestions() { 
            if (!this.searchQuery) return this.allQuestions;
            return this.allQuestions.filter(q => q.content.toLowerCase().includes(this.searchQuery.toLowerCase())); 
        },
        paginatedQuestions() { return this.filteredQuestions(); },
        hasMore() { return this.allQuestions.length < this.totalQuestions; },
        async loadMore() {
            if (this.isLoading) return;
            this.isLoading = true;
            try {
                const res = await fetch(`/api/v1/quiz/{{ quiz.id }}/questions?page=${this.page}&size=${this.pageSize}`);
                const data = await res.json();
                this.allQuestions = [...this.allQuestions, ...data.questions];
                this.totalQuestions = data.total;
                this.page++;
            } catch (e) {} finally { 
                this.isLoading = false;
                this.$nextTick(() => lucide.createIcons());
            }
        },
        async init() {
            // Initial load
            await this.loadMore();
            
            try {
                const res = await fetch(`/api/v1/quiz/{{ quiz.id }}/notes`);
                this.userNotes = await res.json();
            } catch (e) {}
            this.$nextTick(() => lucide.createIcons());
        }
    }
}
</script>
{% endblock %}
